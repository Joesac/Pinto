<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Splash</title>
    <link rel="stylesheet" href="../vendor/semantic-ui/semantic.min.css">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none !important;
        }

        .splash-img {
            width: 100%;
            height: auto;
            -webkit-user-select: none;
            user-select: none;
        }

        .progress {
            position: absolute;
            width: 80%;
            left: 10%;
            bottom: 30px;
        }

        .ui.progress .bar {
            background-color: rgba(255, 255, 255, .8);
        }

        .ui.progress.success .bar {
            background-color: white !important;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <img src="../../assets/Splashscreen.svg" class="splash-img">
        <div class="ui tiny progress" id="progress" data-value="15" data-total="20">
            <div class="bar"></div>
        </div>
    </div>

    <script>
        if (typeof module === 'object') {
            window.module = module; 
            module = undefined;
        }
    </script>
    <script src="../vendor/jquery-3.4.1.min.js"></script>
    <script src="../vendor/semantic-ui/semantic.min.js"></script>
    <script>

        var progressDuration = 1000 * (Math.floor(Math.random() * 4) + 1) 
        
        $progress = $('#progress');
        window.fakeProgress = setInterval(function() {
            $progress.progress('increment');
            
            // stop incrementing when complete
            if($progress.progress('is complete')) {
                clearInterval(window.fakeProgress)
            }
        }, 10);

        $('#progress').progress({
            duration : progressDuration
        })
    </script>
    <script>
        if (window.module) module = window.module;
    </script>
</body>
</html>
